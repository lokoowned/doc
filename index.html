<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>DarkLegion - Guilda MMORPG</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentação oficial da guilda DarkLegion">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Arquivo de Configuração -->
  <script src="config.js"></script>
  
  <!-- Arquivo de Configuração de Listas Google Sheets -->
  <script src="configlists.js"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <link rel="stylesheet" href="custom.css">
  <style>
    footer#footer-basic {
      margin-top: 48px;
      padding: 1.2em 0;
      text-align: center;
      background: #181818;
      color: #aaa;
      font-size: 0.97em;
      border-top: 1px solid #242424;
    }
    footer#footer-basic a {
      color: #6cf;
      margin: 0 8px;
      text-decoration: none;
      opacity: 0.88;
      transition: opacity 0.2s;
    }
    footer#footer-basic a:hover {
      opacity: 1;
      text-decoration: underline;
    }

    /* ShadowBox Styles */
    .shadowbox-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      z-index: 9999;
      animation: fadeIn 0.3s ease;
    }

    .shadowbox-overlay.active {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .shadowbox-content {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 32px;
      max-width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: slideIn 0.3s ease;
    }

    .shadowbox-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      font-size: 24px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      line-height: 1;
      padding: 0;
    }

    .shadowbox-close:hover {
      background: #ff4444;
      border-color: #ff6666;
      transform: rotate(90deg);
    }

    .shadowbox-trigger {
      display: inline-block;
      padding: 10px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s;
      margin: 4px;
      position: relative;
      overflow: visible;
      z-index: 1;
      box-shadow: 
        0 0 8px rgba(102, 126, 234, 0.3),
        0 0 15px rgba(102, 126, 234, 0.2);
      animation: blueGlow 3s ease-in-out infinite;
    }

    @keyframes blueGlow {
      0%, 100% {
        box-shadow: 
          0 0 8px rgba(102, 126, 234, 0.4),
          0 0 15px rgba(102, 126, 234, 0.25),
          0 0 20px rgba(102, 126, 234, 0.15);
      }
      50% {
        box-shadow: 
          0 0 12px rgba(135, 206, 250, 0.5),
          0 0 20px rgba(135, 206, 250, 0.3),
          0 0 28px rgba(135, 206, 250, 0.2);
      }
    }

    .shadowbox-trigger:hover {
      transform: translateY(-2px) scale(1.05);
      animation: blueGlowIntense 2s ease-in-out infinite;
    }

    @keyframes blueGlowIntense {
      0%, 100% {
        box-shadow: 
          0 0 15px rgba(102, 126, 234, 0.6),
          0 0 25px rgba(102, 126, 234, 0.4),
          0 0 35px rgba(102, 126, 234, 0.25);
      }
      50% {
        box-shadow: 
          0 0 18px rgba(135, 206, 250, 0.7),
          0 0 30px rgba(135, 206, 250, 0.5),
          0 0 42px rgba(135, 206, 250, 0.3);
      }
    }

    /* Ícones flutuantes */
    .shadowbox-icon-particle {
      position: absolute;
      pointer-events: none;
      z-index: 999;
      opacity: 0;
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
      animation: floatUpIcon 2.5s ease-out forwards;
    }

    @keyframes floatUpIcon {
      0% {
        opacity: 0;
        transform: translateY(0) translateX(0) rotate(0deg) scale(0.3);
      }
      15% {
        opacity: 1;
        transform: translateY(-20px) translateX(calc(var(--float-x) * 0.2)) rotate(72deg) scale(0.8);
      }
      85% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-120px) translateX(var(--float-x)) rotate(360deg) scale(1.5);
      }
    }

    /* Adiciona brilho azul sutil ao fundo do botão */
    .shadowbox-trigger::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, 
        #4169e1, #667eea, #87ceeb, #5b9bd5, #667eea, #4169e1);
      background-size: 300% 300%;
      border-radius: 8px;
      opacity: 0.3;
      z-index: -1;
      animation: blueWave 4s ease-in-out infinite;
      filter: blur(6px);
    }

    @keyframes blueWave {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    .shadowbox-trigger:hover::before {
      opacity: 0.5;
      filter: blur(8px);
      animation: blueWave 2s ease-in-out infinite;
    }

    /* Efeito de texto brilhante no hover */
    .shadowbox-trigger {
      text-shadow: 0 0 3px rgba(255, 255, 255, 0.3);
    }

    .shadowbox-trigger:hover {
      animation: blueGlowIntense 2s ease-in-out infinite, textGlowBlue 2s ease-in-out infinite;
    }

    @keyframes textGlowBlue {
      0%, 100% {
        text-shadow: 
          0 0 5px rgba(255, 255, 255, 0.6),
          0 0 10px rgba(102, 126, 234, 0.5),
          0 0 15px rgba(102, 126, 234, 0.3);
      }
      50% {
        text-shadow: 
          0 0 5px rgba(255, 255, 255, 0.7),
          0 0 10px rgba(135, 206, 250, 0.6),
          0 0 15px rgba(135, 206, 250, 0.4);
      }
    }

    /* Previne que o botão seja afetado por z-index de outros elementos */
    .shadowbox-trigger {
      isolation: isolate;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Widget Discord Discreto */
    .discord-widget-compact {
      padding: 8px 16px;
      margin: 12px 0;
      background: rgba(88, 101, 242, 0.1);
      border-left: 3px solid #5865f2;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #dcddde;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .discord-widget-compact:hover {
      background: rgba(88, 101, 242, 0.2);
      border-left-color: #7289da;
      transform: translateX(2px);
      box-shadow: 0 2px 8px rgba(88, 101, 242, 0.3);
    }

    .discord-widget-compact:active {
      transform: translateX(1px);
    }

    .discord-widget-compact .discord-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .discord-widget-compact .discord-stats {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .discord-widget-compact .discord-stat {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .discord-widget-compact .discord-stat .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #43b581;
      box-shadow: 0 0 6px #43b581;
      animation: pulse 2s ease-in-out infinite;
    }

    .discord-widget-compact .discord-stat .total-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #747f8d;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        box-shadow: 0 0 6px #43b581;
      }
      50% {
        opacity: 0.6;
        box-shadow: 0 0 12px #43b581;
      }
    }

    .discord-widget-compact .discord-stat span {
      color: #b9bbbe;
    }

    .discord-widget-compact .discord-stat strong {
      color: #fff;
      font-weight: 600;
    }

    /* Widget Servidor Compacto */
    .server-widget-compact {
      padding: 8px 16px;
      margin: 12px 0;
      background: rgba(76, 175, 80, 0.1);
      border-left: 3px solid #4caf50;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #dcddde;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .server-widget-compact:hover {
      background: rgba(76, 175, 80, 0.2);
      border-left-color: #66bb6a;
      transform: translateX(2px);
      box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
    }

    .server-widget-compact:active {
      transform: translateX(1px);
    }

    .server-widget-compact .server-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .server-widget-compact .server-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .server-widget-compact .server-line.server-name-line {
      justify-content: center;
    }

    .server-widget-compact .server-name {
      display: block;
      text-align: center;
      font-weight: 700;
      color: #2bfffc;
      font-size: 14px;
      letter-spacing: 0.5px;
      text-shadow: 0 0 6px rgba(43, 255, 252, 0.9), 0 0 14px rgba(15, 255, 255, 0.4);
    }

    .server-widget-compact .server-online {
      color: #4caf50;
      font-weight: 600;
    }

    .server-widget-compact .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4caf50;
      box-shadow: 0 0 6px #4caf50;
      animation: pulse 2s ease-in-out infinite;
    }

    .sidebar-page-note {
      display: block;
      font-size: 11px;
      color: #9ec2ff;
      margin-left: 22px;
      line-height: 1.3;
      font-style: italic;
      text-transform: none;
    }

    .historia-shadowbox-banner {
      background: linear-gradient(135deg, #1e1b4b, #0f9d58);
      color: #fff;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 0 16px rgba(15, 157, 88, 0.6);
      margin-bottom: 16px;
    }

    .app-name {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .app-name img {
      height: 32px;
      width: 32px;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    }

    /* Sidebar - Exibir títulos completos com quebra de linha */
    .sidebar-nav li a {
      white-space: normal !important;
      overflow: visible !important;
      text-overflow: clip !important;
      word-wrap: break-word;
      word-break: break-word;
      line-height: 1.4;
      padding: 6px 0;
      display: block;
    }

    /* Responsivo */
    @media (max-width: 768px) {
      .shadowbox-content {
        max-width: 95%;
        padding: 24px;
      }
      
      .discord-widget-compact {
        padding: 6px 12px;
        font-size: 12px;
      }
      
      .discord-widget-compact .discord-icon {
        width: 20px;
        height: 20px;
      }

      .server-widget-compact {
        padding: 6px 12px;
        font-size: 12px;
      }
    }

    /* Fogos de Artifício */
    .firework {
      position: fixed;
      pointer-events: none;
      z-index: 99999;
    }

    .firework-particle {
      position: fixed;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      animation: explode 1.5s ease-out forwards;
    }

    @keyframes explode {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0);
      }
    }

    .firework-trail {
      position: fixed;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      animation: trail 1s ease-out forwards;
    }

    @keyframes trail {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(var(--launch-height)) scale(0.5);
      }
    }

    /* Vídeo Overlay de Transição */
    .race-video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 100000;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .race-video-overlay video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      max-width: none;
      max-height: none;
    }

    /* Mobile Portrait - Força vídeo horizontal */
    @media screen and (max-width: 768px) and (orientation: portrait) {
      .race-video-overlay video {
        transform: rotate(90deg);
        width: 100vh;
        height: 100vw;
        object-fit: cover;
      }
    }

    /* Mobile Landscape - Mantém normal */
    @media screen and (max-width: 768px) and (orientation: landscape) {
      .race-video-overlay video {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
      }
    }

    /* Tablet e Desktop - Responsivo */
    @media screen and (min-width: 769px) {
      .race-video-overlay video {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
      }
    }

    .race-video-overlay.fade-out {
      animation: videoFadeOut 0.5s ease-out forwards;
    }

    @keyframes videoFadeOut {
      from {
        opacity: 1;
      }
      to {
        opacity: 0;
      }
    }

    /* Widget Contagem Regressiva */
    .countdown-widget-compact {
      padding: 8px 16px;
      margin: 12px 0;
      background: rgba(255, 193, 7, 0.1);
      border-left: 3px solid #ffc107;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      font-size: 13px;
      color: #dcddde;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .countdown-widget-compact:hover {
      background: rgba(255, 193, 7, 0.15);
      border-left-color: #ffca28;
      transform: translateX(2px);
      box-shadow: 0 2px 8px rgba(255, 193, 7, 0.2);
    }

    .countdown-widget-compact:active {
      transform: translateX(1px);
    }

    .countdown-widget-compact .countdown-title {
      font-weight: 600;
      color: #fff;
      font-size: 12px;
      text-align: left;
      width: 100%;
    }

    .countdown-widget-compact .countdown-timer {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #ffc107;
      font-weight: 600;
      font-family: 'Consolas', 'Monaco', monospace;
      width: 100%;
    }

    .countdown-widget-compact .countdown-icon {
      font-size: 14px;
      flex-shrink: 0;
    }

    .countdown-widget-compact .countdown-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 32px;
    }

    .countdown-widget-compact .countdown-value {
      font-size: 14px;
      color: #fff;
      line-height: 1;
    }

    .countdown-widget-compact .countdown-label {
      font-size: 9px;
      color: #999;
      text-transform: uppercase;
      font-weight: 400;
    }

    .countdown-widget-compact .countdown-separator {
      color: #666;
      font-size: 12px;
    }

    /* Níveis de intensidade baseados na proximidade */
    .countdown-widget-compact.countdown-glow-1 {
      box-shadow: 0 0 8px rgba(255, 193, 7, 0.3);
    }

    .countdown-widget-compact.countdown-glow-2 {
      box-shadow: 0 0 12px rgba(255, 193, 7, 0.4);
      animation: countdownPulse2 2s ease-in-out infinite;
    }

    .countdown-widget-compact.countdown-glow-3 {
      box-shadow: 0 0 18px rgba(255, 193, 7, 0.5);
      animation: countdownPulse3 1.5s ease-in-out infinite;
    }

    .countdown-widget-compact.countdown-glow-4 {
      box-shadow: 0 0 25px rgba(255, 160, 0, 0.6);
      animation: countdownPulse4 1s ease-in-out infinite;
      border-left-color: #ff9800;
    }

    .countdown-widget-compact.countdown-glow-5 {
      box-shadow: 0 0 30px rgba(255, 87, 34, 0.7);
      animation: countdownPulse5 0.8s ease-in-out infinite;
      border-left-color: #ff5722;
      background: rgba(255, 87, 34, 0.15);
    }

    /* FOGO - menos de 1 hora */
    .countdown-widget-compact.countdown-fire {
      background: linear-gradient(135deg, rgba(255, 87, 34, 0.2) 0%, rgba(255, 193, 7, 0.2) 50%, rgba(255, 87, 34, 0.2) 100%);
      border-left-color: #ff3d00;
      animation: fireGlow 0.5s ease-in-out infinite alternate, firePulse 0.3s ease-in-out infinite;
      position: relative;
      overflow: visible;
    }

    .countdown-widget-compact.countdown-fire::before {
      content: '🔥';
      position: absolute;
      left: -8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      animation: fireFlicker 0.2s ease-in-out infinite alternate;
    }

    .countdown-widget-compact.countdown-fire::after {
      content: '🔥';
      position: absolute;
      right: -8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      animation: fireFlicker 0.3s ease-in-out infinite alternate-reverse;
    }

    .countdown-widget-compact.countdown-fire .countdown-title,
    .countdown-widget-compact.countdown-fire .countdown-value {
      animation: textFireGlow 0.4s ease-in-out infinite alternate;
    }

    @keyframes countdownPulse2 {
      0%, 100% { box-shadow: 0 0 12px rgba(255, 193, 7, 0.4); }
      50% { box-shadow: 0 0 18px rgba(255, 193, 7, 0.5); }
    }

    @keyframes countdownPulse3 {
      0%, 100% { box-shadow: 0 0 18px rgba(255, 193, 7, 0.5); }
      50% { box-shadow: 0 0 25px rgba(255, 193, 7, 0.6); }
    }

    @keyframes countdownPulse4 {
      0%, 100% { box-shadow: 0 0 25px rgba(255, 160, 0, 0.6); }
      50% { box-shadow: 0 0 35px rgba(255, 160, 0, 0.7); }
    }

    @keyframes countdownPulse5 {
      0%, 100% { box-shadow: 0 0 30px rgba(255, 87, 34, 0.7); }
      50% { box-shadow: 0 0 40px rgba(255, 87, 34, 0.8); }
    }

    @keyframes fireGlow {
      0% {
        box-shadow: 
          0 0 20px rgba(255, 87, 34, 0.8),
          0 0 40px rgba(255, 152, 0, 0.6),
          0 0 60px rgba(255, 193, 7, 0.4);
      }
      100% {
        box-shadow: 
          0 0 30px rgba(255, 61, 0, 0.9),
          0 0 50px rgba(255, 87, 34, 0.7),
          0 0 70px rgba(255, 152, 0, 0.5);
      }
    }

    @keyframes firePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    @keyframes fireFlicker {
      0% { opacity: 0.7; transform: translateY(-50%) scale(0.9); }
      100% { opacity: 1; transform: translateY(-50%) scale(1.1); }
    }

    @keyframes textFireGlow {
      0% { 
        text-shadow: 0 0 5px rgba(255, 87, 34, 0.5);
        color: #fff;
      }
      100% { 
        text-shadow: 0 0 10px rgba(255, 152, 0, 0.8), 0 0 20px rgba(255, 87, 34, 0.5);
        color: #ffeb3b;
      }
    }

    /* Estado: Objetivo em Andamento */
    .countdown-widget-compact.countdown-active {
      background: linear-gradient(135deg, rgba(76, 175, 80, 0.15) 0%, rgba(0, 200, 83, 0.1) 100%);
      border-left-color: #4caf50;
      animation: activeGlow 2s ease-in-out infinite;
    }

    .countdown-widget-compact.countdown-active .countdown-timer {
      display: none;
    }

    .countdown-widget-compact .countdown-active-text {
      display: none;
      color: #4caf50;
      font-weight: 600;
      font-size: 12px;
      animation: activePulse 1.5s ease-in-out infinite;
    }

    .countdown-widget-compact.countdown-active .countdown-active-text {
      display: block;
    }

    .countdown-widget-compact .countdown-participants {
      display: none;
      color: #7289da;
      font-size: 11px;
      margin-top: 2px;
    }

    .countdown-widget-compact .countdown-participants .participant-count {
      font-weight: 700;
      color: #fff;
    }

    .countdown-widget-compact .countdown-participants .voice-icon {
      margin-right: 4px;
    }

    .countdown-widget-compact.countdown-active .countdown-participants {
      display: block;
      animation: activePulse 2s ease-in-out infinite;
    }

    .countdown-widget-compact .countdown-progress-container {
      display: none;
      width: 100%;
      margin-top: 4px;
    }

    .countdown-widget-compact.countdown-active .countdown-progress-container {
      display: block;
    }

    .countdown-progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    .countdown-progress-fill {
      height: 100%;
      border-radius: 10px;
      background: linear-gradient(90deg,

<script>
  // Calcula a diferença de anos desde janeiro de 2011 até agora
  const startYear = 2011;
  const startMonth = 0; // Janeiro é 0 em JS
  const startDate = new Date(startYear, startMonth);
  const currentDate = new Date();

  // Calcula a diferença em anos, considerando o mês
  let yearsPassed = currentDate.getFullYear() - startDate.getFullYear();
  if (
    currentDate.getMonth() < startDate.getMonth() ||
    (currentDate.getMonth() === startDate.getMonth() && currentDate.getDate() < startDate.getDate())
  ) {
    yearsPassed--;
  }

  // Variável contendo a quantidade de anos completos passados
  // Exemplo de uso:
  //document.write(`Já se passaram ${yearsPassed} anos desde janeiro de 2011.`);
window.yearsPassed = yearsPassed;
</script>

    // ShadowBox Module
    window.ShadowBox = {

      ],
      
      init: function() {
        // Cria o overlay se não existir
        if (!document.getElementById('shadowbox-overlay')) {
          const overlay = document.createElement('div');
          overlay.id = 'shadowbox-overlay';
          overlay.className = 'shadowbox-overlay';
          overlay.innerHTML = `
            <div class="shadowbox-content" id="shadowbox-content">
              <button class="shadowbox-close" onclick="ShadowBox.close()">&times;</button>
              <div id="shadowbox-body"></div>
            </div>
          `;
          document.body.appendChild(overlay);

          // Fecha ao clicar fora do conteúdo
          overlay.addEventListener('click', function(e) {
            if (e.target === overlay) {
              ShadowBox.close();
            }
          });

          // Fecha com ESC
          document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
              ShadowBox.close();
            }
          });
          
          // Delegação de eventos para checkbox (funciona com elementos dinâmicos)
          overlay.addEventListener('change', function(e) {
            if (e.target && e.target.id === 'concordo-regras' && e.target.checked) {
              // Reproduz som de boas-vindas
              const welcomeSound = new Audio('sounds/welcome.wav');
              welcomeSound.volume = 0.7;
              welcomeSound.play().catch(err => {
                console.log('Não foi possível reproduzir o áudio:', err);
              });
              
              // Fecha o shadowbox atual
              ShadowBox.close();
              
              // Aguarda um pequeno delay e abre o ShadowBox de boas-vindas
              setTimeout(function() {
                ShadowBox.openFromElement('shadowbox-concordo');
              }, 300);
            }
          });
        }

        // Adiciona evento de hover aos botões
        this.initButtonEffects();
      },

      initButtonEffects: function() {
        const buttons = document.querySelectorAll('.shadowbox-trigger');
        buttons.forEach(button => {
          // Remove listeners anteriores se existirem
          button.removeEventListener('mouseenter', this.handleMouseEnter);
          button.removeEventListener('mouseleave', this.handleMouseLeave);
          
          // Adiciona novos listeners
          button.addEventListener('mouseenter', this.handleMouseEnter.bind(this));
          button.addEventListener('mouseleave', this.handleMouseLeave.bind(this));
        });
      },

      initCheckboxTriggers: function() {
        // Não é mais necessário - usando delegação de eventos no overlay
        // Mantido para compatibilidade
      },

      handleMouseEnter: function(e) {
        const button = e.currentTarget;
        
        // Inicia geração contínua de ícones
        if (button.iconInterval) {
          clearInterval(button.iconInterval);
        }
        
        // Gera o primeiro conjunto imediatamente
        this.spawnIcons(button);
        
        // Continua gerando enquanto o mouse estiver sobre o botão
        button.iconInterval = setInterval(() => {
          this.spawnIcons(button);
        }, 200);
      },

      handleMouseLeave: function(e) {
        const button = e.currentTarget;
        if (button.iconInterval) {
          clearInterval(button.iconInterval);
          button.iconInterval = null;
        }
      },

      spawnIcons: function(button) {
        const rect = button.getBoundingClientRect();
        const iconsToSpawn = 4 + Math.floor(Math.random() * 4); // 4-7 ícones por vez
        
        for (let i = 0; i < iconsToSpawn; i++) {
          setTimeout(() => {
            const icon = document.createElement('img');
            const randomIcon = this.icons[Math.floor(Math.random() * this.icons.length)];
            icon.src = 'imagens/icones/ani/' + randomIcon;
            icon.className = 'shadowbox-icon-particle';
            
            // Posição inicial aleatória ao redor do botão
            const offsetX = (Math.random() - 0.5) * rect.width;
            const offsetY = (Math.random() - 0.5) * rect.height;
            const startX = rect.left + rect.width / 2 + offsetX + window.scrollX;
            const startY = rect.top + rect.height / 2 + offsetY + window.scrollY;
            
            icon.style.left = startX + 'px';
            icon.style.top = startY + 'px';
            
            // Direção de flutuação aleatória mais ampla
            const floatX = (Math.random() - 0.5) * 200;
            icon.style.setProperty('--float-x', floatX + 'px');
            
            // Duração aleatória para variação
            const duration = 2 + Math.random() * 1;
            icon.style.animationDuration = duration + 's';
            
            // Adiciona evento de erro para fallback
            icon.onerror = function() {
              if (this.parentNode) {
                this.parentNode.removeChild(this);
              }
            };
            
            document.body.appendChild(icon);
            
            // Remove o ícone após a animação
            setTimeout(() => {
              if (icon.parentNode) {
                icon.parentNode.removeChild(icon);
              }
            }, duration * 1000);
          }, i * 40); // Pequeno delay entre cada ícone
        }
      },

      open: function(content) {
        this.init();
        const overlay = document.getElementById('shadowbox-overlay');
        const body = document.getElementById('shadowbox-body');
        body.innerHTML = content;
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      },

      openFromElement: function(elementId) {
        const element = document.getElementById(elementId);
        if (element) {
          const content = element.innerHTML;
          this.open(content);
          
          // Se for o shadowbox de concordância, dispara fogos de artifício
          if (elementId === 'shadowbox-concordo') {
            this.launchFireworks();
          }
          
          // Se for o shadowbox do servidor, toca o som e vídeo da raça
          if (elementId === 'shadowbox-servidor-atual') {
            const config = window.DLConfig || {};
            const guildRace = config.server_guild_race;
            let soundFile = null;
            let videoFile = null;
            
            // Define o arquivo de som e vídeo baseado na raça
            if (guildRace === 'Bellato') {
              soundFile = 'sounds/bcc.wav';
              videoFile = 'efeitos_vfx/bell_transition.webm';
            } else if (guildRace === 'Cora') {
              soundFile = 'sounds/ccc.wav';
              videoFile = 'efeitos_vfx/ccc_transition.webm';
            } else if (guildRace === 'Accretia') {
              soundFile = 'sounds/acc.wav';
              videoFile = 'efeitos_vfx/acc_transition.webm';
            }
            
            // Toca o som se definido
            if (soundFile) {
              const raceSound = new Audio(soundFile);
              raceSound.volume = 0.5;
              raceSound.play().catch(err => {
                console.log('Não foi possível reproduzir o áudio da raça:', err);
              });
            }
            
            // Reproduz o vídeo overlay se definido
            if (videoFile) {
              this.playRaceVideo(videoFile);
            }
          }
        } else {
          console.error('ShadowBox: Elemento não encontrado:', elementId);
        }
      },

      launchFireworks: function() {
        const colors = ['#ff0844', '#ffb700', '#00ff88', '#00cfff', '#b400ff', '#ff006e', '#ffd000'];
        const fireworksCount = 12;
        
        for (let i = 0; i < fireworksCount; i++) {
          setTimeout(() => {
            this.createFirework(colors);
          }, i * 600); // Duração do fogo de artifício
        }
      },

      createFirework: function(colors) {
        const x = Math.random() * window.innerWidth;
        const launchHeight = -(200 + Math.random() * 300);
        const startY = window.innerHeight;
        
        // Cria a trilha do foguete
        const trail = document.createElement('div');
        trail.className = 'firework-trail';
        trail.style.position = 'fixed';
        trail.style.zIndex = '99999';
        trail.style.left = x + 'px';
        trail.style.top = startY + 'px';
        trail.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        trail.style.setProperty('--launch-height', launchHeight + 'px');
        document.body.appendChild(trail);

        // Após a trilha subir, cria a explosão
        setTimeout(() => {
          this.createExplosion(x, startY + launchHeight, colors);
          trail.remove();
        }, 1000);
      },

      createExplosion: function(x, y, colors) {
        const particlesCount = 30 + Math.floor(Math.random() * 20);
        const color = colors[Math.floor(Math.random() * colors.length)];
        
        for (let i = 0; i < particlesCount; i++) {
          const particle = document.createElement('div');
          particle.className = 'firework-particle';
          particle.style.position = 'fixed';
          particle.style.zIndex = '99999';
          particle.style.pointerEvents = 'none';
          particle.style.left = x + 'px';
          particle.style.top = y + 'px';
          particle.style.backgroundColor = color;
          
          const angle = (Math.PI * 2 * i) / particlesCount;
          const velocity = 50 + Math.random() * 100;
          const tx = Math.cos(angle) * velocity;
          const ty = Math.sin(angle) * velocity;
          
          particle.style.setProperty('--tx', tx + 'px');
          particle.style.setProperty('--ty', ty + 'px');
          
          // Adiciona variação no tamanho
          const size = 2 + Math.random() * 4;
          particle.style.width = size + 'px';
          particle.style.height = size + 'px';
          
          // Adiciona brilho
          particle.style.boxShadow = `0 0 ${size * 2}px ${color}`;
          
          document.body.appendChild(particle);
          
          setTimeout(() => {
            particle.remove();
          }, 1500);
        }
      },

      close: function() {
        const overlay = document.getElementById('shadowbox-overlay');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
      },

      playRaceVideo: function(videoFile) {
        // Cria o container do vídeo overlay
        const videoOverlay = document.createElement('div');
        videoOverlay.className = 'race-video-overlay';
        
        // Cria o elemento de vídeo
        const video = document.createElement('video');
        video.src = videoFile;
        video.autoplay = true;
        video.muted = false; // Não silencia o vídeo (caso tenha áudio próprio)
        video.playsInline = true;
        video.style.pointerEvents = 'none';
        
        // Adiciona o vídeo ao overlay
        videoOverlay.appendChild(video);
        document.body.appendChild(videoOverlay);
        
        // Quando o vídeo terminar, faz fade out e remove
        video.addEventListener('ended', () => {
          videoOverlay.classList.add('fade-out');
          setTimeout(() => {
            if (videoOverlay.parentNode) {
              videoOverlay.parentNode.removeChild(videoOverlay);
            }
          }, 500); // Tempo do fade out
        });
        
        // Tratamento de erro
        video.addEventListener('error', (err) => {
          console.log('Não foi possível reproduzir o vídeo da raça:', err);
          if (videoOverlay.parentNode) {
            videoOverlay.parentNode.removeChild(videoOverlay);
          }
        });
        
        // Inicia reprodução
        video.play().catch(err => {
          console.log('Não foi possível iniciar o vídeo da raça:', err);
          if (videoOverlay.parentNode) {
            videoOverlay.parentNode.removeChild(videoOverlay);
          }
        });
      }
    };

        // Plugin Lista de Membros Dinâmica
        function(hook, vm) {
          hook.doneEach(async function() {
            const panel = document.querySelector('.members-panel');
            if (!panel || panel.dataset.membersInit) return;
            
            const config = window.DLConfig || {};
            const honorMedals = Array.isArray(config.honor_medals) ? config.honor_medals : [];

            try {
              // Carrega o CSV
              const response = await fetch('membros.csv');
              const csvText = await response.text();
              
              // Parseia o CSV (todas as linhas são válidas)
              const lines = csvText.split('\n').filter(line => line.trim());
              const members = lines.map(line => {
                // Parse usando ponto e vírgula (;) como delimitador para compatibilidade com Excel BR
                // Remove aspas duplas que o Excel pode adicionar
                const parts = line.split(';').map(p => p.trim().replace(/^"(.*)"$/, '$1'));
                
                // Extrai os campos (Nickname, Data, Status, Servidor, Medalhas, Inativo)
                // Coluna A: Nickname
                // Coluna B: Data de entrada
                // Coluna C: Status
                // Coluna D: Servidor
                // Coluna E: Medalhas (pode ter múltiplas separadas por vírgula)
                // Coluna F: Inativo (True/False)
                const nickname = parts[0] ? parts[0].trim() : '';
                const entrada = parts[1] ? parts[1].trim() : '';
                const status = parts[2] ? parts[2].trim() : '';
                const servidor = parts[3] ? parts[3].trim() : '';
                
                // As medalhas podem estar na coluna E e além
                // Precisamos identificar onde está "True" ou "False" para saber onde param as medalhas
                let inativoIndex = -1;
                for (let i = 4; i < parts.length; i++) {
                  const part = parts[i].trim();
                  if (part === 'True' || part === 'False') {
                    inativoIndex = i;
                    break;
                  }
                }
                
                let medals = [];
                let inativo = false;
                
                if (inativoIndex !== -1) {
                  // Encontrou a coluna Inativo
                  // A coluna E pode conter múltiplas medalhas separadas por vírgula
                  const medalsColumn = parts[4] || '';
                  medals = medalsColumn.split(',').map(m => m.trim()).filter(Boolean);
                  inativo = parts[inativoIndex].trim() === 'True';
                } else {
                  // Não encontrou, assume que parts[4] contém as medalhas
                  const medalsColumn = parts[4] || '';
                  medals = medalsColumn.split(',').map(m => m.trim()).filter(Boolean);
                  inativo = false;
                }
                
                return {
                  nickname,
                  entrada,
                  status,
                  servidor: servidor || '',
                  medals,
                  inativo
                };
              });
              const listEl = panel.querySelector('.members-panel__list');
              const medalsLegendEl = panel.querySelector('#membersMedals .members-panel__medals-icons');
              const totalEl = panel.querySelector('#membersTotalCount');
              const visibleEl = panel.querySelector('#membersVisibleCount');
              const input = panel.querySelector('#searchMember');
              if (!listEl || !visibleEl || !totalEl) return;
              const tooltipId = 'medalTooltip';
              let tooltipEl = document.getElementById(tooltipId);
              if (!tooltipEl) {
                tooltipEl = document.createElement('div');
                tooltipEl.id = tooltipId;
                tooltipEl.className = 'medal-tooltip';
                document.body.appendChild(tooltipEl);
              }

              const updateTooltipPosition = (event) => {
                tooltipEl.style.left = `${event.pageX + 12}px`;
                tooltipEl.style.top = `${event.pageY + 12}px`;
              };

              const tooltipCreated = (medal) => medal && medal.created ? `<div class="medal-tooltip-date">Criada em ${medal.created}</div>` : '';

              const showTooltip = (medal, event) => {
                tooltipEl.innerHTML = `
                  ${medal.image ? `<img src="${medal.image}" alt="${medal.name}">` : ''}
                  <strong>${medal.name}</strong>
                  <p>${medal.description}</p>
                  ${tooltipCreated(medal)}
                `;
                tooltipEl.style.display = 'block';
                updateTooltipPosition(event);
              };

              const hideTooltip = () => {
                tooltipEl.style.display = 'none';
              };

              const extrasMedal = {
                code: 'extras',
                name: 'Extras',
                icon: 'imagens/medalhas/extras.png',
                image: 'imagens/medalhas/extras.png',
                description: 'O jogador ultrapassou o limite de 5 medalhas; clique no nickname para ver as demais.'
              };

              const createMedalIcon = (medal) => {
                if (!medal || !medal.icon) return null;
                const img = document.createElement('img');
                img.src = medal.icon;
                img.alt = medal.name;
                img.title = medal.name;
                img.dataset.medal = medal.code;
                img.addEventListener('mouseenter', (event) => showTooltip(medal, event));
                img.addEventListener('mousemove', updateTooltipPosition);
                img.addEventListener('mouseleave', hideTooltip);
                img.addEventListener('click', () => showMedalDetails(medal));
                return img;
              };
              const medalShadowboxId = 'medal-detail-box';
              const ensureMedalShadowbox = () => {
                let box = document.getElementById(medalShadowboxId);
                if (!box) {
                  box = document.createElement('div');
                  box.id = medalShadowboxId;
                  box.className = 'shadowbox-hidden-content';
                  box.style.display = 'none';
                  document.body.appendChild(box);
                }
                return box;
              };
              const showMedalDetails = (medal) => {
                if (!medal) return;
                const box = ensureMedalShadowbox();
                
                let medalMembers = [];
                if (medal.code === 'extras') {
                  medalMembers = [];
                } else if (medal.code.startsWith('activity-')) {
                  // Para medalhas de atividade, calcula dinamicamente quais membros a possuem
                  if (medal.code === 'activity-novato') {
                    // Caso especial para novatos (menos de 1 ano)
                    medalMembers = members.filter(member => {
                      const activityMedal = getActivityMedal(member.entrada);
                      return activityMedal && activityMedal.code === 'activity-novato';
                    });
                  } else {
                    const targetYears = parseInt(medal.code.replace('activity-', ''), 10);
                    medalMembers = members.filter(member => {
                      const activityMedal = getActivityMedal(member.entrada);
                      if (!activityMedal) return false;
                      const memberYears = parseInt(activityMedal.code.replace('activity-', ''), 10);
                      return memberYears === targetYears;
                    });
                  }
                } else {
                  // Para medalhas normais, busca no array de medals do membro
                  medalMembers = members.filter(member => 
                    Array.isArray(member.medals) && member.medals.includes(medal.code)
                  );
                }
                
                const membersHtml = medalMembers.length
                  ? medalMembers.map(m => {
                      const year = m.entrada ? m.entrada.split('/').pop() : '';
                      return `<li>${m.nickname} · Entrada ${year}</li>`;
                    }).join('')
                  : `<li>Nenhum membro registrado para esta medalha.</li>`;
                box.innerHTML = `
                  <div class="medal-shadowbox-banner">${medal.name}</div>
                  ${medal.image ? `<img src="${medal.image}" alt="${medal.name}" class="medal-shadowbox-image">` : ''}

                    <strong>Portadores</strong>
                    <ul>${membersHtml}</ul>
                  </div>

              return url; // Retorna o URL original se não for prnt.sc
            }
            
            try {
              console.log(`🔍 Tentando extrair imagem de: ${url}`);
              
              // Faz fetch da página HTML do prnt.sc
              const response = await fetch(url, { mode: 'cors' });
              const html = await response.text();
              
              console.log(`📄 HTML recebido (${html.length} caracteres)`);
              
              // MÉTODO 1: Regex para encontrar URLs de img.lightshot.app
              const lightshotRegex = /https:\/\/img\.lightshot\.app\/[A-Za-z0-9_-]+\.(png|jpg|jpeg|gif)/g;
              const lightshotMatch = html.match(lightshotRegex);
              
              if (lightshotMatch && lightshotMatch[0]) {
                console.log(`✅ prnt.sc extraído (regex lightshot): ${url} → ${lightshotMatch[0]}`);
                return lightshotMatch[0];
              }
              
              // MÉTODO 2: Regex para encontrar qualquer URL de imagem no src
              const imgSrcRegex = /src=["'](https?:\/\/[^"']+\.(png|jpg|jpeg|gif|webp))["']/gi;
              const imgMatches = html.match(imgSrcRegex);
              
              if (imgMatches && imgMatches.length > 0) {
                // Extrai a URL limpa do primeiro match
                const cleanUrl = imgMatches[0].match(/src=["']([^"']+)["']/i)[1];
                if (cleanUrl && (cleanUrl.includes('lightshot.app') || cleanUrl.includes('prnt.sc'))) {
                  console.log(`✅ prnt.sc extraído (regex src): ${url} → ${cleanUrl}`);
                  return cleanUrl;
                }
              }
              
              // MÉTODO 3: DOM Parser
              const parser = new DOMParser();
              const doc = parser.parseFromString(html, 'text/html');
              
              // Procura pela imagem com classe "no-click screenshot-image"
              const imgElement = doc.querySelector('.no-click.screenshot-image');
              
              if (imgElement && imgElement.src) {
                console.log(`✅ prnt.sc extraído (DOM .no-click.screenshot-image): ${url} → ${imgElement.src}`);
                return imgElement.src;
              }
              
              // Fallback 1: tenta apenas .screenshot-image
              const screenshotImg = doc.querySelector('.screenshot-image');
              if (screenshotImg && screenshotImg.src) {
                console.log(`✅ prnt.sc extraído (DOM .screenshot-image): ${url} → ${screenshotImg.src}`);
                return screenshotImg.src;
              }
              
              // Fallback 2: tenta img com atributo data-src
              const imgDataSrc = doc.querySelector('img[data-src]');
              if (imgDataSrc && imgDataSrc.dataset.src) {
                console.log(`✅ prnt.sc extraído (DOM data-src): ${url} → ${imgDataSrc.dataset.src}`);
                return imgDataSrc.dataset.src;
              }
              
              // Fallback 3: tenta qualquer img com lightshot
              const lightshotImg = doc.querySelector('img[src*="lightshot"]');
              if (lightshotImg && lightshotImg.src) {
                console.log(`✅ prnt.sc extraído (DOM lightshot): ${url} → ${lightshotImg.src}`);
                return lightshotImg.src;
              }
              
              // Fallback 4: primeira imagem com src válida
              const allImgs = doc.querySelectorAll('img[src]');
              for (const img of allImgs) {
                if (img.src && (img.src.includes('lightshot') || img.src.includes('.png') || img.src.includes('.jpg'))) {
                  console.log(`✅ prnt.sc extraído (DOM primeira img): ${url} → ${img.src}`);

              console.warn(`⚠️ Não foi possível extrair imagem de: ${url}`);
              console.log(`📋 Primeiros 500 caracteres do HTML:`, html.substring(0, 500));
              return url; // Retorna o URL original se falhar

              const headers = thead.querySelectorAll('th');
              const itemlistColumnIndexes = [];
              
              headers.forEach((th, index) => {
                const headerText = th.textContent.toLowerCase().trim();
                if (headerText.includes('itemlist') || headerText.includes('item list') || th.dataset.type === 'itemlist') {
                  itemlistColumnIndexes.push(index);
                  console.log(`✅ Coluna itemlist encontrada no índice ${index}: "${th.textContent}"`);
                }
              });
              
              if (itemlistColumnIndexes.length === 0) return;
              
              // Processa as linhas
              const tbody = table.querySelector('tbody');
              if (!tbody) return;
              
              const rows = tbody.querySelectorAll('tr:not(.group-header)');
              rows.forEach(row => {
                const cells = row.querySelectorAll('td');
                
                itemlistColumnIndexes.forEach(colIndex => {
                  const cell = cells[colIndex];
                  if (!cell || !cell.textContent.trim()) return;
                  
                  // Separa os itens por vírgula
                  const itemNames = cell.textContent.split(',').map(name => name.trim()).filter(name => name);
                  
                  if (itemNames.length === 0) return;
                  
                  // Cria elementos clicáveis para cada item
                  const itemElements = itemNames.map(itemName => {
                    const span = document.createElement('span');
                    span.className = 'item-list-tag';
                    span.textContent = itemName;
                    span.dataset.itemName = itemName;
                    
                    // Adiciona evento de hover
                    span.addEventListener('mouseenter', showItemTooltip);
                    span.addEventListener('mouseleave', hideItemTooltip);
                    span.addEventListener('mousemove', moveItemTooltip);
                    
                    return span;
                  });
                  
                  // Substitui o conteúdo da célula
                  cell.innerHTML = '';
                  itemElements.forEach((el, idx) => {
                    cell.appendChild(el);
                    if (idx < itemElements.length - 1) {
                      cell.appendChild(document.createTextNode(', '));
                    }
                  });
                });
              });
            });
          };
          
          // Cria o tooltip uma vez
          let itemTooltip = null;
          
          function createItemTooltip() {
            if (itemTooltip) return itemTooltip;
            
            itemTooltip = document.createElement('div');
            itemTooltip.className = 'item-tooltip';
            itemTooltip.style.cssText = `
              position: fixed;
              background: linear-gradient(135deg, #1e1e2e, #2a2a3e);
              border: 2px solid #667eea;
              border-radius: 8px;
              padding: 12px;
              max-width: 300px;
              z-index: 10001;
              display: none;
              box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
              pointer-events: none;
            `;
            document.body.appendChild(itemTooltip);
            return itemTooltip;
          }
          
          function showItemTooltip(event) {
            const tooltip = createItemTooltip();
            const itemName = event.target.dataset.itemName;
            
            // Busca o item no banco de dados
            const item = window.DLItemDatabase.find(i => 
              i.name && i.name.toLowerCase().trim() === itemName.toLowerCase().trim()
            );
            
            if (!item) {
              tooltip.innerHTML = `
                <div style="color: #ff6b6b; font-weight: 600;">Item não encontrado</div>
                <div style="color: #aaa; font-size: 0.85rem; margin-top: 4px;">${itemName}</div>
              `;
            } else {
              // Processa a URL do ícone (prnt.sc se necessário)
              const iconUrl = item.icon || '';
              
              tooltip.innerHTML = `
                <div style="display: flex; gap: 10px; align-items: start;">
                  ${iconUrl ? `
                    <div style="flex-shrink: 0;">
                      <img src="${iconUrl}" alt="${item.name}" style="width: 48px; height: 48px; object-fit: contain; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2);" onerror="this.style.display='none'">
                    </div>
                  ` : ''}
                  <div style="flex: 1;">
                    <div style="color: #e0e0ff; font-weight: 700; font-size: 1rem; margin-bottom: 4px;">${item.name}</div>
                    ${item.type ? `<div style="color: #8fa2ff; font-size: 0.85rem; margin-bottom: 6px;">${item.type}</div>` : ''}
                    ${item.description ? `<div style="color: #d0d0e8; font-size: 0.875rem; line-height: 1.4;">${item.description}</div>` : ''}
                  </div>
                </div>
              `;
              
              // Se o ícone for prnt.sc, extrai a imagem real
              if (iconUrl && iconUrl.startsWith('https://prnt.sc/')) {
                window.DLExtractPrntscImage(iconUrl).then(realUrl => {
                  const img = tooltip.querySelector('img');
                  if (img && realUrl !== iconUrl) {
                    img.src = realUrl;
                  }
                });
              }
            }
            
            tooltip.style.display = 'block';
            moveItemTooltip(event);
          }
          
          function hideItemTooltip() {
            if (itemTooltip) {
              itemTooltip.style.display = 'none';
            }
          }
          
          function moveItemTooltip(event) {
            if (!itemTooltip || itemTooltip.style.display === 'none') return;
            
            const x = event.clientX;
            const y = event.clientY;
            const offset = 15;
            
            // Ajusta posição para não sair da tela
            const tooltipRect = itemTooltip.getBoundingClientRect();
            let left = x + offset;
            let top = y + offset;
            
            if (left + tooltipRect.width > window.innerWidth) {
              left = x - tooltipRect.width - offset;
            }
            
            if (top + tooltipRect.height > window.innerHeight) {
              top = y - tooltipRect.height - offset;
            }
            
            itemTooltip.style.left = left + 'px';
            itemTooltip.style.top = top + 'px';
          }
          
          
          // Normaliza códigos (remove {}, trim e lowercase)
          function normalizeCode(text) {
            return (text || '')
              .replace(/[{}]/g, '')
              .trim()
              .toLowerCase();
          }
          
          // Extrai códigos no formato {CODE}
          function extractCodesFromText(text) {
            if (!text) return [];
            const matches = text.match(/\{([^}]+)\}/g);
            if (!matches) return [];
            return matches
              .map(m => m.replace(/[{}]/g, '').trim())
              .filter(Boolean);
          }

          function findItemByCodeOrName(code) {
            if (!window.DLItemDatabase) return null;
            const normalized = normalizeCode(code);
            return window.DLItemDatabase.find(item => {
              const byCode = normalizeCode(item.code || '') === normalized;
              const byName = normalizeCode(item.name || '') === normalized;
              return byCode || byName;
            }) || null;
          }

            let html = `

        // Plugin Expiração de páginas no sidebar
        function(hook, vm) {
          const normalizePath = (value) => {
            if (!value) {
              return '';
            }
            try {
              const url = new URL(value, window.location.origin);
              return url.pathname;
            } catch {
              let path = String(value).trim();
              if (path.startsWith('#')) {
                path = path.slice(1);
              }
              if (!path.startsWith('/')) {
                path = '/' + path.replace(/^\/+/, '');
              }
              return path.split('?')[0].split('#')[0];
            }
          };

          const canonicalPath = (value) => {
            const path = normalizePath(value);
            if (!path) {
              return '';
            }
            return path.replace(/\.md$/i, '').replace(/\/+$/, '');
          };

          const parseExpiration = (value) => {
            if (!value) {
              return null;
            }
            const isoValue = value.includes('T') ? value : `${value}T23:59:59`;
            const date = new Date(isoValue);
            return Number.isFinite(date.getTime()) ? date : null;
          };

          const processSidebar = (expirations) => {
            const sidebar = document.querySelector('.sidebar');
            if (!sidebar) {
              console.log('🔍 [Expiração] Sidebar ainda não encontrado, tentando novamente...');
              return false;
            }

            const now = new Date();
            console.log('📅 [Expiração] Data atual:', now.toISOString());
            console.log('📋 [Expiração] Total de expirações configuradas:', expirations.length);

            expirations.forEach(entry => {
              console.log('🔎 [Expiração] Processando entrada:', entry);
              
              const targetCanonical = canonicalPath(entry.path);
              console.log('🔗 [Expiração] Caminho canonical do target:', targetCanonical);
              
              if (!targetCanonical) {
                console.warn('⚠️ [Expiração] Caminho canonical vazio, pulando');
                return;
              }

              const allLinks = Array.from(sidebar.querySelectorAll('a'));
              console.log('🔗 [Expiração] Total de links no sidebar:', allLinks.length);
              
              const anchor = allLinks.find(link => {
                const href = link.getAttribute('href') || link.pathname || '';
                const linkCanonical = canonicalPath(href);
                console.log(`  - Comparando: "${linkCanonical}" === "${targetCanonical}"`, linkCanonical === targetCanonical);
                return linkCanonical === targetCanonical;
              });
              
              if (!anchor) {
                console.warn('⚠️ [Expiração] Link não encontrado para:', targetCanonical);
                return;
              }
              console.log('✅ [Expiração] Link encontrado:', anchor.textContent.trim());

              const container = anchor.closest('li') || anchor.parentElement;
              if (!container) {
                console.warn('⚠️ [Expiração] Container não encontrado');
                return;
              }

              const expiresAt = parseExpiration(entry.expires_at);
              console.log('📅 [Expiração] Data de expiração:', expiresAt ? expiresAt.toISOString() : 'inválida');
              console.log('⏰ [Expiração] Expirou?', now > expiresAt, '(now > expiresAt)');
              
              if (expiresAt && now > expiresAt) {
                console.log('🗑️ [Expiração] REMOVENDO página expirada:', entry.path);
                container.remove();
                return;
              }

              const noteText = entry.note || entry.text || '';
              if (noteText) {
                console.log('📝 [Expiração] Adicionando nota:', noteText);
                let noteElement = container.querySelector(`.sidebar-page-note[data-page="${targetCanonical}"]`);
                if (!noteElement) {
                  noteElement = document.createElement('span');
                  noteElement.className = 'sidebar-page-note';
                  noteElement.dataset.page = targetCanonical;
                  container.appendChild(noteElement);
                }
                noteElement.textContent = noteText;
              }
            });

            return true;
          };

          hook.doneEach(function() {
            const config = window.DLConfig || {};
            const expirations = Array.isArray(config.page_expirations) ? config.page_expirations : [];
            if (!expirations.length) {
              return;
            }

            const tryProcess = () => {
              const executed = processSidebar(expirations);
              if (!executed) {
                setTimeout(tryProcess, 80);
              }
            };

            setTimeout(tryProcess, 0);
          });
        },

                  </div>
                </div>
              `;
              
              // Adiciona evento de clique para abrir shadowbox
              countdownWidget.addEventListener('click', function() {
                if (window.ShadowBox && typeof window.ShadowBox.openFromElement === 'function') {
                  window.ShadowBox.openFromElement('shadowbox-contagem');
                }
              });
              
              // Função para calcular a data alvo (horário de Brasília)
              function getTargetDate() {
                const [year, month, day] = DATE_OBJECTIVE.split('/').map(Number);
                const [hours, minutes] = TIME_OBJECTIVE.split(':').map(Number);
                
                // Cria a data alvo em UTC-3 (Brasília)
                // Brasília = UTC-3, então adicionamos 3 horas para converter para UTC
                const targetDate = new Date(Date.UTC(year, month - 1, day, hours + 3, minutes, 0));
                
                return targetDate;
              }
              
              // Variável para controlar os intervalos
              let countdownInterval = null;
              let voiceInterval = null;
              
              // Função para buscar membros em canais de voz do Discord
              async function updateVoiceCount() {
                try {
                  const DISCORD_SERVER_ID = config.discord_server_id || '767946841027248129';
                  const response = await fetch('https://discord.com/api/guilds/' + DISCORD_SERVER_ID + '/widget.json');
                  const data = await response.json();
                  
                  // Conta APENAS membros em canais de voz (têm channel_id definido)
                  let voiceCount = 0;
                  if (data.members && Array.isArray(data.members)) {
                    voiceCount = data.members.filter(member => member.channel_id).length;
                  }
                  
                  const voiceEl = document.getElementById('countdown-voice-count');
                  if (voiceEl) voiceEl.textContent = voiceCount;
                  
                } catch (error) {
                  console.log('Não foi possível buscar membros em voz');
                }
              }
              
              // Inicia atualização de voz a cada 30s
              function startVoiceUpdates() {
                if (!voiceInterval) {
                  updateVoiceCount(); // Primeira atualização imediata
                  voiceInterval = setInterval(updateVoiceCount, 30000);
                }
              }
              
              // Para atualização de voz
              function stopVoiceUpdates() {
                if (voiceInterval) {
                  clearInterval(voiceInterval);
                  voiceInterval = null;
                }
              }
              
              // Função para atualizar o countdown
              // Duração do objetivo em andamento (1 hora em ms)
              const ACTIVE_DURATION = 60 * 60 * 1000;
              
              function updateCountdown() {
                const targetDate = getTargetDate();
                const now = new Date();
                const diff = targetDate - now;
                
                if (diff <= 0) {
                  // Objetivo iniciou - verifica se ainda está em andamento
                  const elapsedSinceStart = Math.abs(diff);
                  
                  if (elapsedSinceStart < ACTIVE_DURATION) {
                    // Objetivo em andamento - mostra barra de progresso
                    countdownWidget.classList.remove('countdown-glow-1', 'countdown-glow-2', 'countdown-glow-3', 'countdown-glow-4', 'countdown-glow-5', 'countdown-fire');
                    countdownWidget.classList.add('countdown-active');
                    
                    // Calcula progresso (0% a 100%)
                    const progress = Math.min((elapsedSinceStart / ACTIVE_DURATION) * 100, 100);
                    
                    const progressFill = document.getElementById('countdown-progress-fill');
                    const progressPercent = document.getElementById('countdown-progress-percent');
                    
                    if (progressFill) progressFill.style.width = progress.toFixed(1) + '%';
                    if (progressPercent) progressPercent.textContent = Math.floor(progress) + '%';
                    
                    // Inicia atualização de membros em voz (a cada 30s)
                    startVoiceUpdates();
                    
                    return;
                  } else {
                    // Objetivo concluído - esconde o widget e para atualizações
                    stopVoiceUpdates();
                    countdownWidget.style.display = 'none';
                    if (countdownInterval) {
                      clearInterval(countdownInterval);
                      countdownInterval = null;
                    }
                    console.log('⏱️ Objetivo concluído - widget desabilitado');
                    return;
                  }
                }
                
                // Remove classe de ativo se estiver contando
                countdownWidget.classList.remove('countdown-active');
                stopVoiceUpdates();
                
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                
                document.getElementById('countdown-days').textContent = days.toString().padStart(2, '0');
                document.getElementById('countdown-hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('countdown-minutes').textContent = minutes.toString().padStart(2, '0');
                
                // Remove todas as classes de efeito
                countdownWidget.classList.remove('countdown-glow-1', 'countdown-glow-2', 'countdown-glow-3', 'countdown-glow-4', 'countdown-glow-5', 'countdown-fire');
                
                // Aplica efeitos baseados na proximidade
                const totalHours = days * 24 + hours;
                
                if (totalHours < 1) {
                  // Menos de 1 hora - FOGO! 🔥
                  countdownWidget.classList.add('countdown-fire');
                } else if (totalHours < 6) {
                  // Menos de 6 horas
                  countdownWidget.classList.add('countdown-glow-5');
                } else if (totalHours < 24) {
                  // Menos de 1 dia
                  countdownWidget.classList.add('countdown-glow-4');
                } else if (days < 3) {
                  // Menos de 3 dias
                  countdownWidget.classList.add('countdown-glow-3');
                } else if (days < 7) {
                  // Menos de 1 semana
                  countdownWidget.classList.add('countdown-glow-2');
                } else if (days < 14) {
                  // Menos de 2 semanas
                  countdownWidget.classList.add('countdown-glow-1');
                }
              }
              
              // Carrega o conteúdo do shadowbox do arquivo contagem.md
              async function loadContagemContent() {
                try {
                  const response = await fetch('contagem.md');
                  const markdown = await response.text();
                  
                  // Extrai o style
                  const styleMatch = markdown.match(/<style>([\s\S]*?)<\/style>/);
                  if (styleMatch) {
                    const styleEl = document.createElement('style');
                    styleEl.textContent = styleMatch[1];
                    document.head.appendChild(styleEl);
                  }
                  
                  // Extrai o conteúdo do div shadowbox-contagem (captura tudo até o último </div> antes do </div> final)
                  const divStart = markdown.indexOf('<div id="shadowbox-contagem"');
                  if (divStart !== -1) {
                    // Encontra o fechamento correto contando divs
                    let depth = 0;
                    let i = divStart;
                    let endPos = -1;
                    
                    while (i < markdown.length) {
                      if (markdown.substring(i, i + 4) === '<div') {
                        depth++;
                      } else if (markdown.substring(i, i + 6) === '</div>') {
                        depth--;
                        if (depth === 0) {
                          endPos = i + 6;
                          break;
                        }
                      }
                      i++;
                    }
                    
                    if (endPos !== -1) {
                      const divContent = markdown.substring(divStart, endPos);
                      const tempDiv = document.createElement('div');
                      tempDiv.innerHTML = divContent;
                      document.body.appendChild(tempDiv);
                      
                      // Extrai e executa o script
                      const scriptMatch = markdown.match(/<script>([\s\S]*?)<\/script>/);
                      if (scriptMatch) {
                        const scriptEl = document.createElement('script');
                        scriptEl.textContent = scriptMatch[1];
                        document.body.appendChild(scriptEl);
                      }
                      
                      console.log('✅ Conteúdo contagem.md carregado');
                    }
                  }
                } catch (error) {
                  console.warn('⚠️ Não foi possível carregar contagem.md:', error);
                }
              }
              
              // Injeta o widget na sidebar após o Server Widget
              function injectCountdownWidget() {
                const serverWidget = document.querySelector('.server-widget-compact');
                const discordWidget = document.querySelector('.discord-widget-compact');
                
                // Insere após server widget, ou após discord widget se server não existir
                const targetWidget = serverWidget || discordWidget;
                
                if (targetWidget && !document.querySelector('.countdown-widget-compact')) {
                  targetWidget.parentNode.insertBefore(countdownWidget, targetWidget.nextSibling);
                  
                  // Primeira atualização
                  updateCountdown();
                  
                  // Atualiza a cada minuto (se não expirou)
                  if (countdownWidget.style.display !== 'none') {
                    countdownInterval = setInterval(updateCountdown, 60000);
                  }
                  
                  // Carrega o conteúdo do shadowbox
                  loadContagemContent();
                  
                  console.log('✅ Countdown Widget carregado');
                } else if (!targetWidget) {
                  setTimeout(injectCountdownWidget, 100);
                }
              }
              
              // Aguarda um pouco para garantir que os outros widgets foram carregados
              setTimeout(injectCountdownWidget, 500);
              
            } catch (error) {
              console.error('❌ Erro no Countdown Widget:', error);
            }
          });
        }
      ]
    }
  </script>
