<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste Direto da API</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px; 
      background: #1a1a1a; 
      color: #e0e0e0; 
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 { color: #ffd700; }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      margin: 10px 5px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #2563eb; }
    pre { 
      background: #2a2a2a; 
      padding: 15px; 
      border-radius: 5px; 
      overflow-x: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .log { margin: 10px 0; padding: 10px; border-radius: 5px; }
    .log.success { background: #1e4620; border-left: 4px solid #22c55e; }
    .log.error { background: #4a1e1e; border-left: 4px solid #ef4444; }
    .log.info { background: #1e3a5f; border-left: 4px solid #3b82f6; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #2a2a2a;
    }
    th, td {
      padding: 8px;
      text-align: left;
      border: 1px solid #444;
      font-size: 12px;
    }
    th { background: #333; color: #ffd700; }
  </style>
</head>
<body>
  <h1>🧪 Teste Direto da API do Google Sheets</h1>
  
  <div>
    <button onclick="testFetch()">📊 Buscar Dados</button>
    <button onclick="clearLogs()">🗑️ Limpar Logs</button>
  </div>
  
  <div id="logs"></div>
  <div id="results"></div>
  
  <script>
    const SPREADSHEET_ID = '16ZmFjvIJ5ta54ZkWupPhMsg8-rmZ_OhrCRkJjiAKqos';
    const TAB_NAME = 'ListaMembros';
    
    function log(msg, type = 'info') {
      const logs = document.getElementById('logs');
      const div = document.createElement('div');
      div.className = `log ${type}`;
      div.innerHTML = msg;
      logs.appendChild(div);
      console.log(msg);
    }
    
    function clearLogs() {
      document.getElementById('logs').innerHTML = '';
      document.getElementById('results').innerHTML = '';
    }
    
    async function testFetch() {
      clearLogs();
      
      const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(TAB_NAME)}`;
      
      log(`📍 URL da API:<br><code>${url}</code>`, 'info');
      
      try {
        log('🔄 Iniciando requisição...', 'info');
        const response = await fetch(url);
        
        log(`✅ Status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
        
        if (!response.ok) {
          log('❌ Erro na requisição. Verifique se a planilha está pública.', 'error');
          return;
        }
        
        const csvText = await response.text();
        
        log(`📦 Tamanho dos dados: ${csvText.length} caracteres`, 'info');
        log(`📊 Primeiros 500 caracteres:<br><pre>${csvText.substring(0, 500)}</pre>`, 'info');
        
        // Parse
        const lines = csvText.split('\n').filter(line => line.trim());
        log(`📋 Total de linhas: ${lines.length}`, 'success');
        
        // Mostra primeiras 5 linhas
        log(`🔍 Primeiras 5 linhas:<br><pre>${lines.slice(0, 5).join('\n')}</pre>`, 'info');
        
        // Parse cada linha
        const parsed = parseData(lines);
        displayTable(parsed);
        
      } catch (error) {
        log(`❌ Erro: ${error.message}`, 'error');
        console.error(error);
      }
    }
    
    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        const nextChar = line[i + 1];
        
        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          result.push(current);
          current = '';
        } else {
          current += char;
        }
      }
      
      result.push(current);
      return result;
    }
    
    function parseData(lines) {
      return lines.map((line, index) => {
        const values = parseCSVLine(line);
        
        const nickname = values[0] ? values[0].trim() : '';
        const entrada = values[1] ? values[1].trim() : '';
        const status = values[2] ? values[2].trim() : 'Member';
        const servidor = values[3] ? values[3].trim() : '';
        
        let medalsRaw = '';
        let activeState = 'TRUE';
        
        const col4Value = values[4] ? values[4].trim().toUpperCase() : '';
        
        if (col4Value === 'TRUE' || col4Value === 'FALSE') {
          medalsRaw = '';
          activeState = col4Value;
        } else {
          medalsRaw = col4Value;
          activeState = values[5] ? values[5].trim().toUpperCase() : 'TRUE';
        }
        
        const medals = medalsRaw.split(',').map(m => m.trim()).filter(Boolean);
        const inativo = activeState === 'FALSE';
        
        return {
          linha: index + 1,
          nickname,
          entrada,
          status,
          servidor,
          medals: medals.join(', ') || '-',
          inativo: inativo ? '❌ Inativo' : '✅ Ativo',
          raw: values
        };
      }).filter(m => m.nickname);
    }
    
    function displayTable(data) {
      if (!data || data.length === 0) {
        log('⚠️ Nenhum dado para exibir', 'error');
        return;
      }
      
      const rows = data.map(d => `
        <tr>
          <td>${d.linha}</td>
          <td>${d.nickname}</td>
          <td>${d.entrada}</td>
          <td>${d.status}</td>
          <td>${d.servidor}</td>
          <td>${d.medals}</td>
          <td>${d.inativo}</td>
        </tr>
      `).join('');
      
      const table = `
        <h2>📊 Dados Parseados (${data.length} membros)</h2>
        <table>
          <thead>
            <tr>
              <th>Linha</th>
              <th>Nickname</th>
              <th>Entrada</th>
              <th>Status</th>
              <th>Servidor</th>
              <th>Medalhas</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
      
      document.getElementById('results').innerHTML = table;
    }
    
    window.addEventListener('load', () => {
      log('🌐 Página carregada. Clique em "Buscar Dados" para testar.', 'info');
    });
  </script>
</body>
</html>
